<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPX options report</title>
  <style>body{font-family:system-ui,sans-serif;margin:2rem;color:#222}.err{color:#b00020}</style>
</head>
<body>
  <p id="status">Loading encrypted report…</p>
  <script>
  (async function () {
    const n = 24;
    const status = document.getElementById('status');
    try {
      const parts = await Promise.all(
        Array.from({ length: n }, (_, i) =>
          fetch('./p' + i + '.txt', { cache: 'no-store' }).then(r => {
            if (!r.ok) throw new Error('Failed to load part ' + i + ' (' + r.status + ')');
            return r.text();
          })
        )
      );
      document.open();
      document.write(parts.join(''));
      document.close();
    } catch (e) {
      status.className = 'err';
      status.textContent = 'Could not load report: ' + (e && e.message ? e.message : e);
    }
  })();
  </script>
</body>
</html>
